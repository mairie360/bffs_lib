name: BFFs lib CICD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  CICD:
    # [NOUVEAU] MAIR-493 : TEMPORAIRE, test de mairie360/CICD#142. Repasser `uses` et `cicd_version` sur le tag publie avant merge.
    # Etait epingle sur v3.2.0 (les autres services sont sur v4.2.0).
    uses: mairie360/CICD/.github/workflows/bffs-lib-cicd.yml@mair-493-actions-by-check-and-stack
    with:
      cicd_version: mair-493-actions-by-check-and-stack
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}
